<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Student Records</h2>
        <div>
            <a href="{% url 'add_student' %}" class="btn btn-success">+ Add Student</a>
            <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
        </div>
    </div>

    <!-- Filter & Sort Section -->
    <form method="GET" class="row mb-3">
        <div class="col-md-4">
            <input type="text" name="search" value="{{ request.GET.search }}" placeholder="Search by name" class="form-control">
        </div>
        <div class="col-md-3">
            <select name="sort_by" class="form-select">
                <option value="">Sort By</option>
                <option value="name">Name</option>
                <option value="roll_no">Roll No</option>
                <option value="age">Age</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Apply</button>
        </div>
    </form>

    <!-- Student Table -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Roll No</th>
                <th>Age</th>
                <th>Branch</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.roll_no }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.branch }}</td>
                <td>
                    <a href="{% url 'edit_student' student.id %}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{% url 'delete_student' student.id %}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
                </td>
            </tr>
        {% empty %}
            <tr><td colspan="6" class="text-center text-muted">No students found.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
